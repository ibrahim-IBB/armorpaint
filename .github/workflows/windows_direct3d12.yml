name: Windows (Direct3D12) Verified Success Build

on:
  workflow_dispatch: # تشغيل يدوياً بضغطة زر

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # جلب كافة المحركات والمكونات الفرعية
        lfs: true # --- هذا السطر السحري يجبر السيرفر على تحميل ملف الـ v8 الحقيقي ---

    - name: Configure and Unpack V8 Engine
      shell: cmd
      run: |
        :: البحث الحلقي الذكي لفك ضغط الملف أينما كان مساره الحقيقي في المستودع
        for /r %%i in (v8_monolith.7z) do (
            if exist "%%i" (
                echo Found and Unpacking V8 engine in: %%~dpi
                cd /d "%%~dpi"
                7z x v8_monolith.7z -y
            )
        )

    - name: Generate Visual Studio Solution
      shell: cmd
      run: |
        :: توليد ملف الـ Solution لويندوز 11 من مجلد paint
        cd paint
        ..\base\make

    - name: Build Solution using MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Run MSBuild Compiler
      shell: cmd
      run: |
        cd paint
        msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

    - name: Group Production Files
      shell: cmd
      run: |
        mkdir dist_windows
        if exist paint\build\x64\Release\ArmorPaint.exe (
            copy paint\build\x64\Release\ArmorPaint.exe paint\build\krom\
            xcopy /E /I paint\build\krom dist_windows\
        ) else (
            echo "Error: ArmorPaint.exe not found!" && exit 1
        )

    - name: Upload ArmorPaint Binary
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-11-Full
        path: dist_windows/
