name: Windows (Direct3D12) Release Build

on:
  workflow_dispatch: # تشغيل يدوياً بضغطة زر

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        submodules: recursive # جلب كافة الأكواد والمحركات الفرعية

    # تم استبدال الأداة المحذوفة بأمر النظام المباشر والآمن هنا
    - name: Unpack V8 Libraries
      shell: cmd
      run: |
        cd armorcore\v8\libraries\win32\release
        7z x v8_monolith.7z -y

    - name: Compile Core and Project
      shell: cmd
      run: |
        cd armorcore
        Kinc\make.exe --from . -g direct3d12

    - name: Build Solution using MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Run MSBuild Compiler
      shell: cmd
      run: |
        msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

    - name: Organize Production Files
      shell: cmd
      run: |
        mkdir dist_windows
        copy build\x64\Release\ArmorPaint.exe build\krom\
        xcopy /E /I build\krom dist_windows\

    - name: Upload ArmorPaint Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-11-Full
        path: dist_windows/
